<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="cssBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2965f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264de4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .text { font-family: 'Brush Script MT', 'Lucida Handwriting', cursive; font-size: 80px; font-weight: bold; }
  </style>
  
  <!-- "Pi" White -->
  <text x="50" y="85" fill="white" class="text" filter="url(#glow)">Pi</text>
  
  <!-- "CSS" Blue Gradient -->
  <text x="125" y="85" fill="url(#cssBlue)" class="text" filter="url(#glow)">CSS</text>
  
  <!-- "o" White -->
  <text x="275" y="85" fill="white" class="text" filter="url(#glow)">o</text>
</svg>
